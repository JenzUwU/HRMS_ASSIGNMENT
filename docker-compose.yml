# Local production-style container stack.
#
# Supabase stays external (hosted). No secrets live in this file or in the
# images - they come from:
#   * backend/.env        (git-ignored)  -> all backend server-side secrets
#   * ./.env              (git-ignored)  -> the few build-time NEXT_PUBLIC_* values
#                                           (see .env.example)
#
# Bring up:  docker compose up --build
services:
  backend:
    build: ./backend
    ports:
      # host:container - change the host side via BACKEND_PORT if 8000 is taken.
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      # Container-appropriate overrides (the browser origin the API must allow,
      # and the in-process scheduler stays off - drive the sweep from cron).
      BACKEND_CORS_ORIGINS: "${FRONTEND_ORIGIN:-http://localhost:3000}"
      AUTOMATION_ENABLED: "false"
      ENVIRONMENT: "production"
      DEBUG: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # All browser-safe. Inlined into the client bundle at build time.
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}"
        NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-HRMS Post Offer Engagement}"
        NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:-}"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}"
    ports:
      # host:container - change the host side via FRONTEND_PORT if 3000 is taken.
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Next standalone server binds to $HOSTNAME - force 0.0.0.0 so the
      # in-container healthcheck (and the published port) can reach it. Docker
      # otherwise sets HOSTNAME to the container id.
      HOSTNAME: "0.0.0.0"
      # Server-side (RSC / middleware) reads. The browser bundle already has the
      # localhost URL baked in; server-rendered fetches use the compose network.
      API_INTERNAL_BASE_URL: "http://backend:8000/api/v1"
      NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:-}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
