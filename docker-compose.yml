# Local container stack. Supabase stays external (hosted) - only its URL and
# secret key are injected into the backend. No secrets live in this file or the
# images; supply them via backend/.env (git-ignored) or the shell environment.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      BACKEND_CORS_ORIGINS: "http://localhost:3000"
      # Keep the in-process scheduler off in the container by default.
      AUTOMATION_ENABLED: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api/v1"
        NEXT_PUBLIC_APP_NAME: "HRMS Post Offer Engagement"
    ports:
      - "3000:3000"
    environment:
      # Server-side (RSC) fetches use the internal service name; the browser
      # bundle keeps the localhost URL baked in at build time.
      API_INTERNAL_BASE_URL: "http://backend:8000/api/v1"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
